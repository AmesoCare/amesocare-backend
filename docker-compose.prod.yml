# Single-VM deployment (Oracle Cloud Always Free / Hetzner / any Docker host).
#   docker compose -f docker-compose.prod.yml up -d --build
# Requires a .env file alongside this one — see .env.example.
#
# Add HTTPS via Caddy:
#   docker compose -f docker-compose.prod.yml -f docker-compose.caddy.yml up -d --build
name: ameso-hermes-poc

x-backend-env: &backend-env
  ConnectionStrings__Default: "Host=postgres;Port=5432;Database=postgres;Username=postgres;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
  Kafka__BootstrapServers: "kafka:9092"
  Jwt__Key: "${JWT_KEY:?set JWT_KEY in .env}"

# 0.0.0.0 publishes service ports to the internet (plain-HTTP mode).
# Set BIND_ADDR=127.0.0.1 when fronting with Caddy so only 80/443 are reachable.
x-bind: &bind "${BIND_ADDR:-0.0.0.0}"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"   # loopback only, always — reach it via SSH tunnel
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
    volumes:
      - kafkadata:/var/lib/kafka/data
    # no host port — only backend services reach Kafka, over the compose network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  auth-service:
    build:
      context: .
      args: { SERVICE: Ameso.AuthService }
    restart: unless-stopped
    environment: *backend-env
    ports: ["${BIND_ADDR:-0.0.0.0}:5001:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  patient-service:
    build:
      context: .
      args: { SERVICE: Ameso.PatientService }
    restart: unless-stopped
    environment: *backend-env
    ports: ["${BIND_ADDR:-0.0.0.0}:5002:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  incident-service:
    build:
      context: .
      args: { SERVICE: Ameso.IncidentService }
    restart: unless-stopped
    environment: *backend-env
    ports: ["${BIND_ADDR:-0.0.0.0}:5003:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  notification-service:
    build:
      context: .
      args: { SERVICE: Ameso.NotificationService }
    restart: unless-stopped
    environment:
      <<: *backend-env
      WhatsApp__AccessToken: "${WHATSAPP_ACCESS_TOKEN:-}"
      WhatsApp__PhoneNumberId: "${WHATSAPP_PHONE_NUMBER_ID:-}"
    ports: ["${BIND_ADDR:-0.0.0.0}:5004:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  audit-service:
    build:
      context: .
      args: { SERVICE: Ameso.AuditService }
    restart: unless-stopped
    environment: *backend-env
    ports: ["${BIND_ADDR:-0.0.0.0}:5005:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }


volumes:
  pgdata:
  kafkadata:
