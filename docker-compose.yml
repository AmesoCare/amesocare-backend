name: ameso-hermes-poc

x-backend-env: &backend-env
  ConnectionStrings__Default: "Host=postgres;Port=5432;Database=amesohermes;Username=ameso;Password=ameso"
  Kafka__BootstrapServers: "kafka:9092"
  Jwt__Key: "ameso-hermes-poc-dev-signing-key-0123456789"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: amesohermes
      POSTGRES_USER: ameso
      POSTGRES_PASSWORD: ameso
    ports:
      - "5433:5432"   # host 5433 to avoid clashing with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ameso -d amesohermes"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  auth-service:
    build:
      context: .
      args: { SERVICE: Ameso.AuthService }
    environment: *backend-env
    ports: ["5001:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  patient-service:
    build:
      context: .
      args: { SERVICE: Ameso.PatientService }
    environment: *backend-env
    ports: ["5002:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  incident-service:
    build:
      context: .
      args: { SERVICE: Ameso.IncidentService }
    environment: *backend-env
    ports: ["5003:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  notification-service:
    build:
      context: .
      args: { SERVICE: Ameso.NotificationService }
    environment:
      <<: *backend-env
      WhatsApp__AccessToken: "${WHATSAPP_ACCESS_TOKEN:-}"
      WhatsApp__PhoneNumberId: "1201052393097333"
    ports: ["5004:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  audit-service:
    build:
      context: .
      args: { SERVICE: Ameso.AuditService }
    environment: *backend-env
    ports: ["5005:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }


volumes:
  pgdata:
